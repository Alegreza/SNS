services:
  - type: web
    name: nextfound
    runtime: node
    buildCommand: npm run install:server
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: nextfound-db
          property: connectionString

databases:
  - name: nextfound-db
    databaseName: nextfound
    user: nextfound
    plan: free
